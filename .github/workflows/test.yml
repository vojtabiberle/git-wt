name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y bats bats-support bats-assert bats-file

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests
        run: make test-integration
